name: Sync Goodreads books

on:
  schedule:
    # Daily ~8:00 AM US Eastern (12:00 UTC; 13:00 during EDT)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-books:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync 4–5★ books from Goodreads
        run: python scripts/sync_goodreads_books.py

      - name: Commit bookshelf updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/books-sync.json
          if git diff --staged --quiet; then
            echo "No bookshelf changes."
            exit 0
          fi
          git commit -m "Add newly rated Goodreads books"
          # Rebase onto latest main in case another push landed during the run
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying…"
            sleep 5
          done
          echo "Failed to push after retries."
          exit 1
