    <main class="content page">
      <article class="post">
        <div class="post__entry">
          <div class="galton" data-galton>
            <div class="galton__panel">
              <div class="galton__top" role="toolbar" aria-label="Galton board controls">
                <div class="galton__transport">
                  <button type="button" class="galton__btn galton__btn--icon" data-galton-action="toggle" aria-label="Play" aria-pressed="false" title="Play / Pause">
                    <svg class="galton__icon galton__icon--playpause" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M3 6h2.5v12H3V6zm4 0h2.5v12H7V6z" fill="currentColor"/>
                      <path d="M12.5 6v12l9-6-9-6z" fill="currentColor"/>
                    </svg>
                  </button>
                  <button type="button" class="galton__btn galton__btn--icon" data-galton-action="reset" aria-label="Reset board" title="Reset">
                    <svg class="galton__icon" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="currentColor"/>
                    </svg>
                  </button>
                  <a class="galton__btn galton__btn--icon" href="https://en.wikipedia.org/wiki/Bean_machine" target="_blank" rel="noopener" aria-label="About Galton boards on Wikipedia" title="About Galton boards">
                    <span class="galton__help" aria-hidden="true">?</span>
                  </a>
                </div>
                <h1 class="galton__title">Galton Board</h1>
                <span class="galton__count" data-galton-count>0 balls</span>
              </div>
              <div class="galton__fields">
                <label class="galton__field">
                  <span class="galton__field-label">Rows</span>
                  <input type="number" min="4" max="100" step="1" value="12" data-galton-rows aria-label="Number of peg rows">
                </label>
                <label class="galton__field">
                  <span class="galton__field-label">Speed</span>
                  <span class="galton__field-input">
                    <input type="number" min="0.1" max="100" step="0.1" value="1" data-galton-speed aria-label="Balls per second">
                    <span class="galton__unit">/s</span>
                  </span>
                </label>
                <label class="galton__field">
                  <span class="galton__field-label">Fall</span>
                  <span class="galton__field-input">
                    <input type="number" min="0.2" max="10" step="0.1" value="1.2" data-galton-fall aria-label="Seconds for a ball to fall from top to bottom">
                    <span class="galton__unit">s</span>
                  </span>
                </label>
                <label class="galton__field galton__field--bias">
                  <span class="galton__field-label">Bias</span>
                  <span class="galton__field-input">
                    <input type="range" min="0.2" max="0.8" step="0.01" value="0.5" data-galton-bias aria-label="Probability of bouncing right">
                    <span class="galton__bias-val" data-galton-bias-label>0.50</span>
                  </span>
                </label>
              </div>
            </div>
            <canvas class="galton__canvas" width="720" height="640" aria-label="Galton board animation"></canvas>
          </div>
        </div>
      </article>
