  <script>
    window.publiiThemeMenuConfig = {
      mobileMenuMode: "sidebar",
      animationSpeed: 300,
      submenuWidth: "auto",
      doubleClickTime: 500,
      mobileMenuExpandableSubmenus: true,
      relatedContainerForOverlayMenuSelector: ".top"
    };

    (function () {
      var wrap = document.querySelector(".cv-embed-wrap");
      var btn = document.querySelector(".cv-pdf-fs-toggle");
      var iconPath = btn && btn.querySelector("path");
      var ICON_ENTER = "M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5";
      var ICON_EXIT = "M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5";
      if (!wrap || !btn || !iconPath || !wrap.requestFullscreen) {
        if (btn) {
          btn.hidden = true;
        }
        return;
      }

      function isFs() {
        return document.fullscreenElement === wrap;
      }

      function sync() {
        var active = isFs();
        iconPath.setAttribute("d", active ? ICON_EXIT : ICON_ENTER);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
        btn.setAttribute("aria-label", active ? "Exit fullscreen" : "View CV fullscreen");
        btn.title = active ? "Exit fullscreen (Esc)" : "Fullscreen";
      }

      btn.addEventListener("click", function () {
        if (isFs()) {
          document.exitFullscreen();
        } else {
          wrap.requestFullscreen();
        }
      });

      document.addEventListener("fullscreenchange", sync);
      sync();
    })();
  </script>
